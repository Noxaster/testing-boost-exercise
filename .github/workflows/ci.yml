name: CI Workflow

on: [push]

jobs:
  style_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install clang-format
        run: sudo apt-get install -y clang-format

      - name: Check Style
        run: clang-format --dry-run -Werror -i src/*.cpp src/*.hpp tests/*.cpp

  build:
    runs-on: ubuntu-latest
    needs: style_check
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-test-dev libeigen3-dev libyaml-cpp-dev

      - name: Configure CMake
        run: cmake -S . -B build

      - name: Build Project
        run: cmake --build build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compiled-binaries
          path: build/
          retention-days: 1

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Runtime Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-test-dev libeigen3-dev libyaml-cpp-dev

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: compiled-binaries
          path: build

      - name: Fix Permissions
        run: chmod +x build/testsidemade

      - name: Run CTest
        run: |
          cd build
          ctest --output-on-failure